name: Actualisation des données

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualisation
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: pip install -e .
      - name: Téléchargement et pipeline complet
        run: python -m dvf.cli all --force
      - name: Publication des résultats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add README.md images outputs/FINDINGS.md outputs/tables outputs/quality_report.md \
                  outputs/note_de_synthese.pdf outputs/tableau/tableau_communes.csv \
                  outputs/tableau/tableau_moteurs_prix.csv outputs/tableau/tableau_audit.csv
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Actualisation automatique des données DVF ($(date +%Y-%m-%d))"
            git push origin HEAD:main
          fi
