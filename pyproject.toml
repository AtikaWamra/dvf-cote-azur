[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvf-cote-azur"
version = "1.0.0"
description = "Analyse du marché immobilier des Alpes-Maritimes à partir des données DVF"
authors = [{ name = "Atika Wamra" }]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.0",
    "pyarrow>=14",
    "matplotlib>=3.8",
    "tabulate>=0.9",
    "statsmodels>=0.14",
    "reportlab>=4.0",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
dvf = "dvf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]
